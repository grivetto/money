# Money — Banco di prova a secco (configurazione VERSIONATA, spec docs/02).
# Il banco legge, calcola, dichiara. NON invia: l'invio e' assente dal codice,
# verificato staticamente (deploy/tests/, in CI a ogni push).
# I segreti NON stanno qui: stanno in config/.env_banco (git-ignored).

exchange_rest:
  name: okx
  eea: true                # eea.okx.com: le chiavi EU falliscono altrove con 50119

bots:
  - symbol: BTC/EUR
    strategy: banco_secco
    # Capitale REALE sul conto main (non quello aspirato). Al 27/09/2026:
    # 100,0030 EUR nel FUNDING (versamento +74 EUR rispetto ai 26,0030 del
    # 26/09, misurato dal banco in collaudo); il trading ha totalEq 0. Il
    # banco legge ENTRAMBI e li riporta separati (spec §4.1).
    capital: 100.00       # tripwire tonda: il cash reale e' 100,0030; sotto 100 deve suonare
    frazione_per_posizione: 0.25
    min_notional: 1.0      # fallback, se il mercato non dichiara il minimo
    tick_interval: 300     # il timer systemd gira ogni 5 minuti
    health_path: logs/banco_secco_health.json   # relativo a PROJECT_ROOT
    enabled: true
