<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denaro Trading Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', monospace; 
            background: #0a0a0f; 
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00ff88;
            margin-bottom: 30px;
        }
        h1 { 
            color: #00ff88; 
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        .stat-card h3 { color: #888; font-size: 0.9em; margin-bottom: 10px; }
        .stat-card .value { 
            color: #00ff88; 
            font-size: 2em; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,136,0.3);
        }
        
        .bots-section { margin-top: 30px; }
        .bots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .bot-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #333;
        }
        .bot-card h4 { 
            color: #fff; 
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status.online { background: #00ff88; color: #000; }
        .status.offline { background: #ff4444; color: #fff; }
        .status.error { background: #ffaa00; color: #000; }
        
        .logs {
            margin-top: 30px;
            background: #111;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }
        .log-entry { 
            padding: 5px 0; 
            border-bottom: 1px solid #222;
            color: #888;
        }
        .log-entry.success { color: #00ff88; }
        .log-entry.warning { color: #ffaa00; }
        .log-entry.error { color: #ff4444; }
        
        .refresh {
            text-align: center;
            margin: 20px 0;
            color: #666;
        }
        
        .machine {
            margin: 20px 0;
            padding: 20px;
            background: #1a1a2e;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .machine h2 { 
            color: #00ff88; 
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .updating { animation: pulse 1s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 DENARO TRADING SYSTEM</h1>
            <p>Infrastructure Status Dashboard</p>
        </header>
        
        <div class="refresh">
            <span id="lastUpdate">Caricamento...</span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>EUR BALANCE</h3>
                <div class="value" id="eurBalance">--</div>
            </div>
            <div class="stat-card">
                <h3>BOTS ONLINE</h3>
                <div class="value" id="botsOnline">--</div>
            </div>
            <div class="stat-card">
                <h3>API STATUS</h3>
                <div class="value" id="apiStatus">--</div>
            </div>
            <div class="stat-card">
                <h3>SYSTEM</h3>
                <div class="value" id="systemStatus">--</div>
            </div>
        </div>
        
        <div class="bots-section" id="botsContainer">
            <!-- Bot status will be injected here -->
        </div>
        
        <div class="logs">
            <h3 style="color: #00ff88; margin-bottom: 15px;">📊 RECENT ACTIVITY</h3>
            <div id="logEntries"></div>
        </div>
    </div>
    
    <script>
        const API_ENDPOINTS = {
            'nuvola': 'http://localhost/denaro_status.json',
            'marcodg1': 'http://87.106.222.123/denaro_status.json'
        };
        
        async function fetchStatus(url) {
            try {
                const response = await fetch(url, { 
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    signal: AbortSignal.timeout(5000)
                });
                if (!response.ok) throw new Error('Network error');
                return await response.json();
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }
        
        async function updateDashboard() {
            const container = document.getElementById('botsContainer');
            const logContainer = document.getElementById('logEntries');
            
            // Fetch local status first (this is nuvola)
            const localStatus = await fetchStatus('/denaro/status/bot_status.json');
            
            if (localStatus) {
                // Update stats
                document.getElementById('eurBalance').textContent = 
                    localStatus.balance?.EUR ? localStatus.balance.EUR.toFixed(2) + '€' : '--';
                
                const onlineCount = Object.values(localStatus.bots || {}).filter(v => v === 'ONLINE').length;
                document.getElementById('botsOnline').textContent = onlineCount;
                
                const apiStatus = localStatus.api === 'OK' ? 'OK' : 'ERROR';
                document.getElementById('apiStatus').textContent = apiStatus;
                document.getElementById('apiStatus').style.color = apiStatus === 'OK' ? '#00ff88' : '#ff4444';
                
                document.getElementById('systemStatus').textContent = localStatus.all_ok ? '✅' : '⚠️';
                
                // Update bots
                let botsHTML = '';
                for (const [bot, status] of Object.entries(localStatus.bots || {})) {
                    const statusClass = status === 'ONLINE' ? 'online' : 'offline';
                    botsHTML += `
                        <div class="bot-card">
                            <h4>${bot} <span class="status ${statusClass}">${status}</span></h4>
                        </div>
                    `;
                }
                container.innerHTML = botsHTML;
                
                // Add timestamp
                const time = localStatus.timestamp ? new Date(localStatus.timestamp).toLocaleTimeString() : '--';
                document.getElementById('lastUpdate').textContent = `Ultimo aggiornamento: ${time}`;
                
                // Add log
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry ' + (localStatus.all_ok ? 'success' : 'warning');
                logEntry.textContent = `[${time}] NUVOLA - Bots: ${onlineCount}/4 | API: ${apiStatus} | EUR: ${localStatus.balance?.EUR?.toFixed(2) || 0}€`;
                logContainer.insertBefore(logEntry, logContainer.firstChild);
                
                // Keep only last 20 logs
                while (logContainer.children.length > 20) {
                    logContainer.removeChild(logContainer.lastChild);
                }
            } else {
                document.getElementById('systemStatus').textContent = '❌';
            }
        }
        
        // Initial load
        updateDashboard();
        
        // Auto-refresh every 30 seconds
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html>
