server {
    listen 80;
    listen [::]:80;
    server_name sgrivett.ddns.net;

    # Redirect to HTTPS (after getting cert)
    # return 301 https://$server_name$request_uri;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /denaro/ {
        alias /home/sergio/denaro/;
        autoindex on;
    }

    location /status {
        proxy_pass http://127.0.0.1:8888;
    }
}

