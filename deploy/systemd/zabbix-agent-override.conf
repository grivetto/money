# zabbix-agent su MARCODG1: l'agent bind-a 127.0.0.1 + IP tailnet (ListenIP in
# /etc/zabbix/zabbix_agentd.conf). Al boot, se tailscaled non è ancora su, il bind
# fallisce e l'agent esce 1: il monitoraggio del nodo resta cieco fino a un
# intervento manuale (incidente 20/10/26, power loss FSN1-DC22).
# Installazione: /etc/systemd/system/zabbix-agent.service.d/override.conf
[Unit]
After=tailscaled.service network-online.target
Wants=tailscaled.service

[Service]
Restart=on-failure
RestartSec=10
StartLimitIntervalSec=300
StartLimitBurst=10
