# Default server for port 80 - Kitchen Lab (home)
# 2026-10-14: + /zabbix/ e /status.json (Kitchen Lab). La home e' index.html -> symlink a /var/www/kitchen-lab/index.html
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    root /var/www/html;
    index index.html index.htm;
    
    server_name _;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Proxy verso Apache su /apache/
    location /apache/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Zabbix (reverse tunnel mc2 -> MARCODG1)
    location /zabbix/ {
        proxy_pass http://127.0.0.1:1080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /zabbix { return 301 /zabbix/; }

    # Kitchen Lab status API
    location = /status.json {
        add_header Cache-Control "no-store";
    }
    
    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# Default server for un-matched hostnames on port 443 - Kitchen Lab (home)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/html;

    ssl_certificate /etc/letsencrypt/live/mgrivett.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgrivett.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Kitchen Lab status API
    location = /status.json {
        add_header Cache-Control "no-store";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /zabbix/ {
        proxy_pass http://127.0.0.1:1080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /zabbix {
        return 301 /zabbix/;
    }

    location /denaro/ {
        alias /var/www/denaro/;
        index index.html;
    }
    location = /denaro/stats.json {
        alias /tmp/denaro_stats.json;
    }

    location /risto/ {
        alias /var/www/risto/;
        index index.html;
    }
    location /lumen/ {
        alias /var/www/risto/;
        index index.html;
    }
    location / {
        # 2026-10-14: era proxy_pass http://127.0.0.1:8080 (Apache, spento) -> 502.
        # Ora serve i file statici (home Kitchen Lab via symlink di index.html).
        try_files $uri $uri/ =404;
    }
}
