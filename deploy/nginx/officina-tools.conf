# Officina — proxy HTTPS per i tool (mc2.tail1b5252.ts.net:8443-8450)
# Creato 2026-10-21 [merlino]: i link "apri" di /agenti puntavano a http://<ip LAN>:porta
# e Chrome (HTTPS-Only mode) li blocca da pagina https. Qui ogni tool è in TLS
# sull'host tailnet, accessibile solo da tailnet/LAN (allow/deny).
# Cert: /etc/nginx/ssl/mc2.tail1b5252.ts.net.{crt,key} (rinnovo cron kitchen-lab).
# Nota: omarchy:5080 e win:3080 (DSH) ascoltano solo su localhost -> non esposti
# (la pagina non mostra "apri" per quei tool finche' non bindano su LAN).

# mc2 · Agent Zero
server {
    listen 8443 ssl http2;
    server_name mc2.tail1b5252.ts.net;
    include /etc/nginx/snippets/officina-ssl.conf;
    location / { proxy_pass http://127.0.0.1:50080; }
}

