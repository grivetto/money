<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>web.grivetto.eu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container {
    max-width: 720px;
    text-align: center;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #58a6ff 0%, #a371f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    color: #8b949e;
    font-size: 1.125rem;
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
    margin-bottom: 2rem;
  }
  .link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #58a6ff;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
  }
  .link:hover {
    border-color: #58a6ff;
    background: #1f2937;
    transform: translateY(-1px);
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    border-radius: 999px;
    color: #22c55e;
    font-size: 0.875rem;
    font-weight: 500;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .footer {
    margin-top: 3rem;
    color: #484f58;
    font-size: 0.875rem;
  }
  .footer a { color: #8b949e; text-decoration: none; }
  .footer a:hover { color: #58a6ff; }
</style>
</head>
<body>
<div class="container">

  <div class="links">

</div>

</html>
