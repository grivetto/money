name: CI
# Qualita' minima del repo money: lint, test, compilazione e test con -O (assert rimossi).
# Il progetto non deve potersi dichiarare "verde" con assert disattivabili o lint rosso.
# Matrice su ogni versione Python dichiarata supportata (requires-python >=3.11: testata
# 3.11, 3.12 e 3.14 - le versioni in uso sui nodi). Dipendenze installate dal lock di
# sviluppo requirements-dev.lock: ambiente riproducibile da un clone pulito.
# Rigenerare il lock con: uv pip compile pyproject.toml --extra dev --universal --python-version 3.11 -o requirements-dev.lock
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qualita:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installa dipendenze (dal lock di sviluppo)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Ruff (lint)
        run: ruff check .
      - name: Compilazione (compileall)
        run: python -m compileall -q src scripts ops
      - name: Test (normale)
        run: python -m pytest -q
      - name: "Test con -O (assert rimossi: i controlli di capitale devono reggere)"
        run: python -O -m pytest -q