<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denaro Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#0a0e17;color:#e0e6f0;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:22px;color:#00d4ff;letter-spacing:1px}
.time{color:#6b7a99;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.card{background:#111827;border-radius:12px;padding:18px;border:1px solid #1e293b;transition:.2s}
.card:hover{border-color:#00d4ff33}
.card h3{font-size:13px;color:#6b7a99;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.status{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:80px}
.stat .val{font-size:22px;font-weight:700;color:#fff}
.stat .lab{font-size:11px;color:#6b7a99;margin-top:2px}
.stat .val.green{color:#22c55e}
.stat .val.red{color:#ef4444}
.stat .val.yellow{color:#eab308}
.stat .val.blue{color:#00d4ff}
.bar{width:100%;height:4px;background:#1e293b;border-radius:2px;margin-top:6px}
.bar-fill{height:4px;border-radius:2px;transition:width .5s}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.ok{background:#22c55e22;color:#22c55e}
.tag.warn{background:#eab30822;color:#eab308}
.tag.err{background:#ef444422;color:#ef4444}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.row .l{color:#6b7a99}.row .r{font-weight:500}
.mt-12{margin-top:12px}
</style>
</head>
<body>
<div class="header"><h1>⚡ DENARO</h1><span class="time" id="clock">caricamento...</span></div>

<div class="grid" id="nuvola-card">
  <div class="card"><h3>🟣 NUVOLA · SOL/EUR</h3><div class="status" id="nuvola-stats"><div class="stat"><div class="lab">caricamento...</div></div></div></div>
</div>
<div class="grid" id="marcodg1-card">
  <div class="card"><h3>🟠 MARCODG1 · ADA/EUR</h3><div class="status" id="marcodg1-stats"><div class="stat"><div class="lab">caricamento...</div></div></div></div>
</div>
 <div class="grid" id="mc2-card">
  <div class="card"><h3>💻 MC2 · SCALPER ETH/EUR</h3><div class="status" id="mc2-stats"><div class="stat"><div class="lab">caricamento...</div></div></div></div>
</div>
<div class="grid" id="sentiment-card">
  <div class="card"><h3>📊 SENTIMENT</h3><div class="status" id="sentiment-stats"><div class="stat"><div class="lab">caricamento...</div></div></div></div>
</div>

<script>
function $(id){return document.getElementById(id)}
function load(){
 fetch('nuvola.json?'+Date.now()).then(r=>r.json()).then(d=>{
  $('nuvola-stats').innerHTML=
   `<div class="stat"><div class="val ${d.b>0?'green':'red'}">${d.b||0}</div><div class="lab">Bot</div></div>
    <div class="stat"><div class="val ${d.w>=2?'green':'red'}">${d.w||0}</div><div class="lab">Watchdog</div></div>
    <div class="stat"><div class="val green">${d.i||0}€</div><div class="lab">Investito</div></div>
    <div class="stat"><div class="val ${parseFloat(d.p||0)>=0?'green':'red'}">${d.p||0}€</div><div class="lab">Profit</div></div>
    <div class="stat"><div class="val blue">${d.pr||'?'}€</div><div class="lab">Prezzo</div></div>
    <div class="stat"><div class="val ${d.t==='STRONG_UP'?'green':d.t==='STRONG_DOWN'?'red':'yellow'}">${d.t||'?'}</div><div class="lab">Trend</div></div>
    <div class="stat"><div class="val">${d.tr||0}</div><div class="lab">Trades</div></div>
    <div class="stat"><span class="tag ${d.a==='active'?'ok':'err'}">${d.a||'?'}</span><div class="lab">Servizio</div></div>
    <div class="stat"><div class="val">${d.r||'?'}</div><div class="lab">RSI</div></div>`;
 }).catch(()=>$('nuvola-stats').innerHTML='<div class="stat"><div class="lab" style="color:#ef4444">offline</div></div>');
 
 fetch('marcodg1.json?'+Date.now()).then(r=>r.json()).then(d=>{
  $('marcodg1-stats').innerHTML=
   `<div class="stat"><div class="val ${d.b>0?'green':'red'}">${d.b||0}</div><div class="lab">Bot</div></div>
    <div class="stat"><div class="val ${d.w>=2?'green':'red'}">${d.w||0}</div><div class="lab">Watchdog</div></div>
    <div class="stat"><div class="val green">${d.i||0}€</div><div class="lab">Investito</div></div>
    <div class="stat"><div class="val ${parseFloat(d.p||0)>=0?'green':'red'}">${d.p||0}€</div><div class="lab">Profit</div></div>
    <div class="stat"><div class="val blue">${d.pr||'?'}€</div><div class="lab">Prezzo</div></div>
    <div class="stat"><div class="val ${d.t==='STRONG_UP'?'green':d.t==='STRONG_DOWN'?'red':'yellow'}">${d.t||'?'}</div><div class="lab">Trend</div></div>
    <div class="stat"><div class="val">${d.tr||0}</div><div class="lab">Trades</div></div>
    <div class="stat"><span class="tag ${d.a==='active'?'ok':'err'}">${d.a||'?'}</span><div class="lab">Servizio</div></div>
    <div class="stat"><div class="val">${d.d||'?'}%</div><div class="lab">Disk</div>
     <div class="bar"><div class="bar-fill" style="width:${d.d||0}%;background:${(d.d||0)>80?'#ef4444':(d.d||0)>60?'#eab308':'#22c55e'}"></div></div></div>`;
 }).catch(()=>$('marcodg1-stats').innerHTML='<div class="stat"><div class="lab" style="color:#ef4444">offline</div></div>');
 
 fetch('mc2.json?'+Date.now()).then(r=>r.json()).then(d=>{
  let pos=d.sb||0;
  $('mc2-stats').innerHTML=
   `<div class="stat"><div class="val ${d.sc>0?'green':'red'}">${d.sc||0}</div><div class="lab">Scalper attivo</div></div>
    <div class="stat"><div class="val ${pos>0?'green':'yellow'}">${pos||0}</div><div class="lab">Posizioni</div></div>
    <div class="stat"><div class="val ${parseFloat(d.sp||0)>=0?'green':'red'}">${d.sp||'0.00'}€</div><div class="lab">PnL Scalper</div></div>
    <div class="stat"><div class="val blue">${d.spr||'?'}€</div><div class="lab">ETH Prezzo</div></div>
    <div class="stat"><div class="val">${d.sr||'?'}</div><div class="lab">RSI</div></div>
    <div class="stat"><div class="val">${parseFloat(d.se||0).toFixed(1)}€</div><div class="lab">EUR liberi</div></div>
    <div class="stat"><div class="val">${d.d||'?'}%</div><div class="lab">Disk MC2</div>
     <div class="bar"><div class="bar-fill" style="width:${d.d||0}%;background:${(d.d||0)>80?'#ef4444':(d.d||0)>60?'#eab308':'#22c55e'}"></div></div></div>
    <div class="stat"><div class="val">${d.z?'✅':'❌'}</div><div class="lab">Zabbix</div></div>`;
 }).catch(()=>$('mc2-stats').innerHTML='<div class="stat"><div class="lab" style="color:#ef4444">offline</div></div>');
 
  $('clock').textContent=new Date().toLocaleString('it-IT');
 }
 
 fetch('sentiment.json?'+Date.now()).then(r=>r.json()).then(d=>{
  let fng=d.fng||50;
  let cls=fng>60?'green':fng>40?'yellow':'red';
  let lbl=cls==='green'?'🚀':'⚠️';
  $('sentiment-stats').innerHTML=
   `<div class="stat"><div class="val ${cls}">${d.fng||'?'}</div><div class="lab">F&G Index</div></div>
    <div class="stat"><div class="val">${d.label||'?'}</div><div class="lab">Sentiment</div></div>
    <div class="stat"><div class="val blue">${d.btc_dom||'?'}%</div><div class="lab">BTC Dominance</div></div>
    <div class="stat"><div class="val">${lbl} ${cls==='green'?'2025 Corrida':cls==='red'?'Paura':'Neutrale'}</div><div class="lab">${d.fng>60?'Ottimo per acquisti':d.fng<40?'Cautela':'Attesa'}</div></div>`;
 }).catch(()=>{});
 
 load();
setInterval(load,15000);
</script>
</body>
</html>
